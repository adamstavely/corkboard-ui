<!-- Every Trench Coat element inside takes the Clean look; data-tc-look on <html> only sets the tokens. -->
<tc-look-provider look="clean">
  <div class="shell">
    @if (showHeader()) {
      <header class="topbar">
        <tc-header-brand name="Corkboard" href="/" (tc-navigate)="onBrandNavigate($event)"></tc-header-brand>
        <!-- Loaded once the page is idle, so the command menu isn't part of the first download. -->
        @if (session.org()) {
          @defer (on idle) {
            <app-board-search />
          }
        }
        <tc-notifications
          [items]="notifications.items()"
          [categories]="notificationCategories"
          (tc-item-open)="onNotificationOpen($event)"
          (tc-read-change)="onNotificationsRead($event)"
          (tc-mark-all-read)="onAllRead($event)"
        ></tc-notifications>
        <tc-header-nav [user]="auth.profile()" [accountItems]="accountItems()" (tc-account-select)="onAccountSelect($event)"></tc-header-nav>
      </header>
    }
    <main class="content">
      <router-outlet />
    </main>
    <tc-toaster position="bottom-right"></tc-toaster>
  </div>
</tc-look-provider>
